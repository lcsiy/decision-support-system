[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dss"
version = "9.0.0"
description = "A股实盘交易决策支持系统 - 超短线尾盘分析与分钟数据采集"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "tushare>=1.4.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
dss-tail-analysis = "dss.interface_layer.tail_analysis:main"
dss-minute-collector = "dss.interface_layer.minute_collector:main"
dss-feedback-loop = "dss.optimization_engine.run_feedback_loop:main"

[tool.setuptools.packages.find]
include = ["dss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
